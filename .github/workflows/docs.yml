name: Docs

# Builds the Zensical documentation site on every push and pull request, and
# publishes it to GitHub Pages only on pushes to the default branch and on
# release tags. See specs/project/documentation.spec.md ("CI Requirements").

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Allow one concurrent deployment; cancel in-progress runs on the same ref.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Generate API reference
        run: bash scripts/generate-docs.sh

      - name: Fail if generated reference is stale
        run: |
          if ! git diff --quiet -- docs/reference; then
            echo "::error::docs/reference is out of date. Run scripts/generate-docs.sh and commit the result." >&2
            git diff --stat -- docs/reference
            exit 1
          fi

      - name: Build site
        # --clean rebuilds from scratch: zensical 0.0.45's incremental cache
        # resolves cross-references non-deterministically and can falsely report
        # existing pages as missing under --strict. A from-scratch build is
        # reliable.
        run: uvx zensical build --strict --clean

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Publish only on pushes to the default branch or on release tags — never
    # on pull requests.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
