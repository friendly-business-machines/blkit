[package]
name = "blkit"
default-run = "blkit"
version = "0.1.0"
edition = "2024"

[dependencies]
rust_decimal = { version = "1.39", features = ["serde-str"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
uuid = { version = "1", features = ["v4"] }
turso = { version = "=0.7.2", default-features = false }
futures-util = "0.3"
axum = "0.8"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
rust_decimal = "1.39"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
