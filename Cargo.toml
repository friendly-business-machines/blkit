[package]
name = "blkit"
default-run = "blkit"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
console = "0.16"
indicatif = "0.18"
miette = "7"
thiserror = "2"
rust_decimal = { version = "1.39", features = ["maths", "serde-str"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
unicode-segmentation = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
uuid = { version = "1", features = ["v4"] }
turso = { version = "=0.7.2", default-features = false }
futures-util = "0.3"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio-postgres = "0.7.18"
toml_edit = "0.25.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["logs"] }
opentelemetry-appender-tracing = "0.33"

[build-dependencies]
rust_decimal = { version = "1.39", features = ["maths"] }
chrono = "0.4"
regex = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
testcontainers-modules = { version = "=0.15.0", features = ["postgres"] }
