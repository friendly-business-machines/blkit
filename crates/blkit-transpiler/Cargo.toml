[package]
name = "blkit-transpiler"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
blkit-core = { version = "=0.1.0", path = "../blkit-core" }
chrono = { version = "0.4", features = ["serde"] }
chumsky = { version = "0.13.0", features = ["pratt"] }
logos = "0.16.1"
regex = "1"
rust_decimal = { version = "1.39", features = ["maths", "serde-str"] }
serde_json = "1"
toml_edit = "0.25.15"
