[package]
name = "blkit-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = { version = "0.3", optional = true }
axum = { version = "0.8", optional = true, features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
deadpool-postgres = { version = "0.14.2", default-features = false, optional = true, features = ["rt_tokio_1"] }
dotenv-ng = { version = "1.0", default-features = false, optional = true }
futures-util = { version = "0.3", optional = true }
http = { version = "1", optional = true }
object_store = { version = "=0.14.2", default-features = false, optional = true }
opentelemetry-appender-tracing = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["logs", "http-proto", "reqwest-blocking-client"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["logs"], optional = true }
regex = "1"
rust_decimal = { version = "1.39", features = ["maths", "serde-str"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"], optional = true }
tokio-postgres = { version = "0.7.18", optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["fmt", "std"], optional = true }
turso = { version = "=0.7.2", default-features = false, optional = true }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
async-trait = "0.1"
futures-util = "0.3"
log = "0.4"
testcontainers-modules = { version = "=0.15.0", features = ["postgres"] }
tokio = { version = "1", features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "attachment_reader"
required-features = ["worker", "attachment-local", "local-persistence"]

[[test]]
name = "attachments"
required-features = ["worker", "local-persistence"]

[[test]]
name = "concurrency"
required-features = ["worker", "local-persistence"]

[[test]]
name = "engine"
required-features = ["worker", "local-persistence"]

[[test]]
name = "store"
required-features = ["worker", "local-persistence"]

[[test]]
name = "logging"
required-features = ["logging"]

[features]
default = []
attachment-local = ["dep:object_store", "object_store/fs", "dep:tokio", "dep:uuid"]
attachment-cloud = ["dep:object_store", "object_store/aws", "object_store/gcp", "object_store/azure", "dep:tokio", "dep:uuid", "dep:futures-util"]
api-server = ["dep:axum", "dep:async-stream", "dep:tracing"]
worker = ["dep:tokio", "dep:uuid"]
local-persistence = ["dep:turso", "dep:tokio"]
remote-persistence = ["dep:deadpool-postgres", "dep:tokio-postgres", "dep:tokio", "dep:tracing", "dep:uuid", "dep:tokio-postgres-rustls", "dep:rustls", "dep:rustls-native-certs", "dep:dotenv-ng"]
logging = ["dep:http", "dep:tracing", "dep:tracing-subscriber", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:opentelemetry-appender-tracing"]
