repos:
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.90.8
    hooks:
      - id: trufflehog
        language: system
        args: [--no-update]

  - repo: local
    hooks:
      - id: rust-fmt
        name: Check Rust formatting
        entry: cargo fmt --check
        language: system
        files: '(^Cargo\.(toml|lock)$|\.rs$)'
        pass_filenames: false
      - id: rust-clippy
        name: Check Rust lints
        entry: env CARGO_BUILD_JOBS=1 cargo clippy --all-targets --locked -- -D warnings
        language: system
        files: '(^Cargo\.(toml|lock)$|\.rs$)'
        pass_filenames: false
      # Rust tests run explicitly; the full suite is too slow for pre-commit.
      # - id: rust-test
      #   name: Run Rust tests
      #   entry: scripts/without-git-env.sh env CARGO_TARGET_DIR=target/nested-tests CARGO_BUILD_JOBS=1 RUST_TEST_THREADS=1 cargo test --locked --target-dir target
      #   language: system
      #   files: '(^Cargo\.(toml|lock)$|\.rs$)'
      #   pass_filenames: false
      - id: markdownlint
        name: Markdownlint
        entry: markdownlint-cli2
        language: system
        types: [markdown]
        exclude: ^openspec/
      - id: hadolint
        name: Hadolint
        entry: hadolint
        language: system
        types: [dockerfile]
      - id: docker-build
        name: Build modified Dockerfiles
        entry: scripts/without-git-env.sh scripts/check-docker-build.sh
        language: system
        types: [dockerfile]
      - id: check-devcontainer
        name: Validate devcontainer.json
        entry: scripts/check-jsonc-schema.py
        language: system
        files: ^\.devcontainer/devcontainer\.json$
        types: [json]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-added-large-files
        args: [--maxkb=2048]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.33.3
    hooks:
      - id: check-metaschema
        files: \.schema\.json$
      - id: check-jsonschema
        name: Validate OpenSpec configuration
        args: [--schemafile, schemas/openspec-config.schema.json]
        files: ^openspec/config\.yaml$
        types: [yaml]
