repos:
  # ---------------------------------------------------------------------------
  # General
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # docs/reference/ is generated by gomarkdoc (generate-docs.sh) and
      # docs/llms{,-full}.txt by generate-llms-txt.sh; exempt both from the
      # whitespace/EOL fixers so they stay byte-identical to the tool output
      # (which the CI staleness check regenerates and diffs).
      - id: trailing-whitespace
        exclude: ^docs/(reference/|llms(-full)?\.txt$)
      - id: end-of-file-fixer
        exclude: ^docs/(reference/|llms(-full)?\.txt$)
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^docs/(reference/|llms(-full)?\.txt$)
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # devcontainer.json is JSONC (allows comments); check-json uses a
        # strict JSON parser and would always fail on it. It's validated
        # instead by the check-jsonschema hook below, which can parse JSON5.
        exclude: ^\.devcontainer/devcontainer\.json$
      # - id: no-commit-to-branch
      #   args: [--branch, main, --branch, master]
      - id: check-added-large-files
        args: [--maxkb=2048]

  # ---------------------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------------------
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.88.1
    hooks:
      - id: trufflehog
        name: TruffleHog secret scan
        # --exclude-paths skips go.sum, whose module checksums are high-entropy
        # base64 that trips credential detectors but can never hold a real
        # secret (see .trufflehog-exclude.txt).
        entry: trufflehog git file://. --since-commit HEAD --results=verified,unknown,unverified --exclude-paths=.trufflehog-exclude.txt --fail
        language: golang
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Markdown
  # ---------------------------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: [--fix]
        # docs/reference/ is generated by gomarkdoc (see scripts/generate-docs.sh)
        # and must match the tool's output exactly — do not lint or rewrite it.
        exclude: ^docs/reference/

  # ---------------------------------------------------------------------------
  # Docker
  # ---------------------------------------------------------------------------
  # hadolint binary is installed system-wide in the devcontainer Dockerfile
  # (see .devcontainer/Dockerfile), so this uses the `hadolint` (system) hook
  # rather than `hadolint-docker`.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint

  # Verify every Dockerfile still builds (see AGENTS.md). hadolint above only
  # lints syntax/best-practices; this actually runs `docker build` so a broken
  # RUN step or unresolvable base image is caught before commit. Local hook
  # since there's no published pre-commit hook for "does this Dockerfile
  # build" — it's inherently project-specific which Dockerfiles exist.
  - repo: local
    hooks:
      - id: docker-build-devcontainer
        name: Build devcontainer image (verify Dockerfile builds)
        entry: docker build -f .devcontainer/Dockerfile .
        language: system
        pass_filenames: false
        files: '^\.devcontainer/Dockerfile$'

  # Validate devcontainer.json's structure, including VS Code's
  # customizations.vscode.extensions/settings shape (see
  # .devcontainer/devcontainer.schema.json for why that schema is a local
  # file rather than upstream's, and why --force-filetype json5 is needed).
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.37.4"
    hooks:
      - id: check-jsonschema
        name: Validate devcontainer.json
        files: ^\.devcontainer/devcontainer\.json$
        types: [json]
        additional_dependencies: ["pyjson5"]
        args:
          - --force-filetype
          - json5
          - --schemafile
          - .devcontainer/devcontainer.schema.json

  # ---------------------------------------------------------------------------
  # Go
  # ---------------------------------------------------------------------------
  # dnephin/pre-commit-golang is archived and its hooks require goimports /
  # golangci-lint to be pre-installed on PATH. The official golangci-lint repo
  # builds the tool itself (language: golang) and, since v2, runs gofmt +
  # goimports as built-in formatters via `fmt` — so these two hooks replace the
  # old go-fmt, go-imports, and golangci-lint hooks. Both lint the whole module
  # (pass_filenames is false), so no per-path file filter is needed.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint-fmt
      - id: golangci-lint-full

  # Keep go.mod/go.sum tidy: run `go mod tidy` and fail if it changes either
  # file, so missing/superfluous requires and stale indirect markers are caught
  # before commit. Local hook since there's no published pre-commit hook for
  # this; `go` is on PATH in the devcontainer. Runs whenever Go source or the
  # module files themselves change.
  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy (verify go.mod/go.sum are current)
        entry: bash -c 'go mod tidy && git diff --exit-code go.mod go.sum'
        language: system
        pass_filenames: false
        files: '\.go$|^go\.(mod|sum)$'

  # ---------------------------------------------------------------------------
  # Documentation site
  # ---------------------------------------------------------------------------
  # Verify the Zensical site still builds whenever documentation source changes.
  # Zensical has no published pre-commit hook, so this is a local hook that runs
  # the same strict build as CI — failing on broken internal links, invalid
  # anchors, or unresolved nav references. It runs only when files under docs/ or
  # the site config change (pass_filenames is false, so it always builds the
  # whole site rather than the staged subset). zensical is provided on PATH via
  # uv (see .devcontainer/Dockerfile).
  #
  # `--clean` rebuilds from scratch rather than reusing the incremental cache:
  # the cache (zensical 0.0.45) resolves cross-references non-deterministically
  # and intermittently reports existing pages as missing, which would make this
  # hook flaky. A from-scratch build is reliable and fast for a site this size.
  - repo: local
    hooks:
      - id: zensical-build
        name: Build docs site (zensical --strict)
        entry: zensical build --strict --clean
        language: system
        pass_filenames: false
        files: '^docs/.*|^zensical\.toml$'

  # ---------------------------------------------------------------------------
  # Generated API reference
  # ---------------------------------------------------------------------------
  # Keep docs/reference/ in sync with the godoc comments it is generated from.
  # When Go source (or the generator itself) changes, regenerate the reference
  # Markdown. If that produces any change, pre-commit reports the modified files
  # and fails the commit — stage the regenerated docs and commit again. This is
  # the same staleness guarantee the CI docs job enforces, caught locally.
  - repo: local
    hooks:
      - id: generate-docs
        name: Regenerate API reference (docs/reference)
        entry: scripts/generate-docs.sh
        language: script
        pass_filenames: false
        files: '\.go$|^scripts/generate-docs\.sh$'

  # ---------------------------------------------------------------------------
  # LLM discovery files
  # ---------------------------------------------------------------------------
  # Keep docs/llms.txt and docs/llms-full.txt in sync with the nav and pages
  # they are generated from. Runs after generate-docs because llms-full.txt
  # embeds the generated reference. Triggers on any docs change, the site
  # config, Go source (reference content flows in), or the generator itself; a
  # resulting change fails the commit so the regenerated files can be staged.
  - repo: local
    hooks:
      - id: generate-llms
        name: Regenerate llms.txt files (docs/llms*.txt)
        entry: scripts/generate-llms-txt.sh
        language: script
        pass_filenames: false
        files: '^docs/.*|^zensical\.toml$|\.go$|^scripts/generate-llms-txt\.sh$'
