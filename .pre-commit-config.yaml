repos:
  # ---------------------------------------------------------------------------
  # General
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # docs/reference/ is generated by gomarkdoc (see scripts/generate-docs.sh);
      # exempt it from the whitespace/EOL fixers so it stays byte-identical to
      # the tool's output (which the CI staleness check regenerates and diffs).
      - id: trailing-whitespace
        exclude: ^docs/reference/
      - id: end-of-file-fixer
        exclude: ^docs/reference/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^docs/reference/
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      # - id: no-commit-to-branch
      #   args: [--branch, main, --branch, master]
      - id: check-added-large-files
        args: [--maxkb=2048]

  # ---------------------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------------------
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.88.1
    hooks:
      - id: trufflehog
        name: TruffleHog secret scan
        entry: trufflehog git file://. --since-commit HEAD --results=verified,unknown,unverified --fail
        language: golang
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Markdown
  # ---------------------------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: [--fix]
        # docs/reference/ is generated by gomarkdoc (see scripts/generate-docs.sh)
        # and must match the tool's output exactly — do not lint or rewrite it.
        exclude: ^docs/reference/

  # ---------------------------------------------------------------------------
  # Go
  # ---------------------------------------------------------------------------
  # dnephin/pre-commit-golang is archived and its hooks require goimports /
  # golangci-lint to be pre-installed on PATH. The official golangci-lint repo
  # builds the tool itself (language: golang) and, since v2, runs gofmt +
  # goimports as built-in formatters via `fmt` — so these two hooks replace the
  # old go-fmt, go-imports, and golangci-lint hooks. Both lint the whole module
  # (pass_filenames is false), so no per-path file filter is needed.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint-fmt
      - id: golangci-lint-full

  # ---------------------------------------------------------------------------
  # Documentation site
  # ---------------------------------------------------------------------------
  # Verify the Zensical site still builds whenever documentation source changes.
  # Zensical has no published pre-commit hook, so this is a local hook that runs
  # the same strict build as CI — failing on broken internal links, invalid
  # anchors, or unresolved nav references. It runs only when files under docs/ or
  # the site config change (pass_filenames is false, so it always builds the
  # whole site rather than the staged subset). zensical is provided on PATH via
  # uv (see .devcontainer/Dockerfile).
  #
  # `--clean` rebuilds from scratch rather than reusing the incremental cache:
  # the cache (zensical 0.0.45) resolves cross-references non-deterministically
  # and intermittently reports existing pages as missing, which would make this
  # hook flaky. A from-scratch build is reliable and fast for a site this size.
  - repo: local
    hooks:
      - id: zensical-build
        name: Build docs site (zensical --strict)
        entry: zensical build --strict --clean
        language: system
        pass_filenames: false
        files: '^docs/.*|^zensical\.toml$'

  # ---------------------------------------------------------------------------
  # Generated API reference
  # ---------------------------------------------------------------------------
  # Keep docs/reference/ in sync with the godoc comments it is generated from.
  # When Go source (or the generator itself) changes, regenerate the reference
  # Markdown. If that produces any change, pre-commit reports the modified files
  # and fails the commit — stage the regenerated docs and commit again. This is
  # the same staleness guarantee the CI docs job enforces, caught locally.
  - repo: local
    hooks:
      - id: generate-docs
        name: Regenerate API reference (docs/reference)
        entry: scripts/generate-docs.sh
        language: script
        pass_filenames: false
        files: '\.go$|^scripts/generate-docs\.sh$'
